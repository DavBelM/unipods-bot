<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniPods AI Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>UniPods AI Assistant</h1>
    <p class="subtitle">Ask about anything covered in the coaching sessions. <a href="/dashboard.html">Monitoring →</a></p>
  </header>

  <main id="chat"></main>

  <form id="composer">
    <input id="question" type="text" placeholder="Ask a question about a session..." autocomplete="off" required>
    <button type="submit" id="send">Send</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
